version: 2.1

orbs:
  tools: replikativ/clj-tools@0

workflows:
  build-test-and-deploy:
    jobs:
      - tools/setup:
          context: docker-deploy
          # The stacked Datahike dependency generates two JVM interfaces when
          # consumed from git. Prepare it before the orb resolves :test.
          pre-steps:
            - checkout
            - run:
                name: Prepare git dependencies
                command: clojure -X:deps prep :aliases '[:dev :test :build]'
      - tools/build:
          context: docker-deploy
          requires:
            - tools/setup
      - tools/format:
          context: docker-deploy
          requires:
            - tools/setup
      - test-git:
          context: docker-deploy
      - test-datahike:
          context: docker-deploy
      - tools/deploy:
          context:
            - clojars-deploy
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/build
            - test-git
            - test-datahike
      - tools/release:
          context:
            - github-token
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/deploy

jobs:
  test-datahike:
    docker:
      - image: cimg/clojure:1.11.1
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Download dependencies
          command: clojure -P -M:test
      - run:
          name: Run Datahike adapter tests
          command: clojure -M:test -n yggdrasil.adapters.datahike-test

  test-git:
    docker:
      # Datahike's git-dependency prep uses current tools.build, which loads
      # clojure.java.process and therefore requires Clojure 1.12.
      - image: cimg/clojure:1.12-openjdk-17.0
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Configure git for tests
          command: |
            git config --global user.email "ci@test.com"
            git config --global user.name "CI Test"
      - run:
          name: Download dependencies
          command: |
            clojure -X:deps prep :aliases '[:test]'
            clojure -P -M:test
      - run:
          name: Run git adapter tests
          command: clojure -M:test -n yggdrasil.adapters.git-test
